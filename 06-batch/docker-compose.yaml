services:
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile
    image: zoomcamp-spark:latest
    container_name: spark-master
    hostname: spark-master
    env_file: .env 
    command: >
      /bin/bash -c "/opt/spark/sbin/start-master.sh && tail -f /dev/null"
    volumes:
      - ./:/opt/workspace
      - ./datalake:/app/datalake
      - ./gcp-key:/opt/gcp-key:ro
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /opt/gcp-key/application_default_credentials.json
      GOOGLE_CLOUD_PROJECT: ${GCP_PROJECT_ID}
    ports:
      - "7077:7077"
      - "8080:8080"
    networks:
      - spark-network

  spark-worker:
    image: zoomcamp-spark:latest
    container_name: spark-worker
    hostname: spark-worker
    depends_on:
      - spark-master
    command: >
      /bin/bash -c "/opt/spark/sbin/start-worker.sh spark://spark-master:7077 && tail -f /dev/null"
    volumes:
      - ./:/opt/workspace
      - ./datalake:/app/datalake
      - ./gcp-key:/opt/gcp-key:ro
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /opt/gcp-key/application_default_credentials.json
      GOOGLE_CLOUD_PROJECT: ${GCP_PROJECT_ID}
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
    ports:
      - "8081:8081"
    networks:
      - spark-network


networks:
  spark-network:
    driver: bridge