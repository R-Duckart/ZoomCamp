version: 2

sources:
  - name: main
    description: "Raw NYC TLC taxi trip data"
    schema: "{{ 'main' if target.type == 'duckdb' else 'taxiny_raw' }}"
    tables:
      - name: green_tripdata
        description: "Raw green taxi (SHL/Street Hail Livery) trip data collected via LPEP"
        columns:
          - name: VendorID
            description: "A code indicating the LPEP provider. 1=Creative Mobile Technologies, LLC; 2=VeriFone Inc."
          - name: lpep_pickup_datetime
            description: "The date and time when the meter was engaged."
          - name: lpep_dropoff_datetime
            description: "The date and time when the meter was disengaged."
          - name: store_and_fwd_flag
            description: "Whether the trip record was held in vehicle memory before sending to the vendor. Y=store and forward trip, N=not a store and forward trip."
          - name: RatecodeID
            description: "The final rate code in effect at the end of the trip. 1=Standard rate, 2=JFK, 3=Newark, 4=Nassau or Westchester, 5=Negotiated fare, 6=Group ride."
          - name: PULocationID
            description: "TLC Taxi Zone in which the meter was engaged."
          - name: DOLocationID
            description: "TLC Taxi Zone in which the meter was disengaged."
          - name: passenger_count
            description: "The number of passengers in the vehicle. This is a driver-entered value."
          - name: trip_distance
            description: "The elapsed trip distance in miles reported by the taximeter."
          - name: fare_amount
            description: "The time-and-distance fare calculated by the meter."
          - name: extra
            description: "Miscellaneous extras and surcharges. Currently, this only includes the $0.50 and $1 rush hour and overnight charges."
          - name: mta_tax
            description: "$0.50 MTA tax that is automatically triggered based on the metered rate in use."
          - name: tip_amount
            description: "Tip amount. This field is automatically populated for credit card tips. Cash tips are not included."
          - name: tolls_amount
            description: "Total amount of all tolls paid in trip."
          - name: ehail_fee
            description: "E-hail fee (not currently in use)."
          - name: improvement_surcharge
            description: "$0.30 improvement surcharge assessed on hailed trips at the flag drop."
          - name: total_amount
            description: "The total amount charged to passengers. Does not include cash tips."
          - name: payment_type
            description: "How the passenger paid for the trip. 1=Credit card, 2=Cash, 3=No charge, 4=Dispute, 5=Unknown, 6=Voided trip."
          - name: trip_type
            description: "Whether the trip was a street-hail or a dispatch. 1=Street-hail, 2=Dispatch."
          - name: congestion_surcharge
            description: "Congestion surcharge ($2.75 for green taxi trips)."

      - name: yellow_tripdata
        description: "Raw yellow taxi (medallion) trip data collected via TPEP"
        columns:
          - name: VendorID
            description: "A code indicating the TPEP provider. 1=Creative Mobile Technologies, LLC; 2=VeriFone Inc."
          - name: tpep_pickup_datetime
            description: "The date and time when the meter was engaged."
          - name: tpep_dropoff_datetime
            description: "The date and time when the meter was disengaged."
          - name: passenger_count
            description: "The number of passengers in the vehicle. This is a driver-entered value."
          - name: trip_distance
            description: "The elapsed trip distance in miles reported by the taximeter."
          - name: RatecodeID
            description: "The final rate code in effect at the end of the trip. 1=Standard rate, 2=JFK, 3=Newark, 4=Nassau or Westchester, 5=Negotiated fare, 6=Group ride."
          - name: store_and_fwd_flag
            description: "Whether the trip record was held in vehicle memory before sending to the vendor. Y=store and forward trip, N=not a store and forward trip."
          - name: PULocationID
            description: "TLC Taxi Zone in which the meter was engaged."
          - name: DOLocationID
            description: "TLC Taxi Zone in which the meter was disengaged."
          - name: payment_type
            description: "How the passenger paid for the trip. 1=Credit card, 2=Cash, 3=No charge, 4=Dispute, 5=Unknown, 6=Voided trip."
          - name: fare_amount
            description: "The time-and-distance fare calculated by the meter."
          - name: extra
            description: "Miscellaneous extras and surcharges. Currently, this only includes the $0.50 and $1 rush hour and overnight charges."
          - name: mta_tax
            description: "$0.50 MTA tax that is automatically triggered based on the metered rate in use."
          - name: tip_amount
            description: "Tip amount. This field is automatically populated for credit card tips. Cash tips are not included."
          - name: tolls_amount
            description: "Total amount of all tolls paid in trip."
          - name: improvement_surcharge
            description: "$0.30 improvement surcharge assessed on hailed trips at the flag drop."
          - name: total_amount
            description: "The total amount charged to passengers. Does not include cash tips."
          - name: congestion_surcharge
            description: "Congestion surcharge ($2.50 for yellow taxi trips)."

      - name: taxi_zones
        description: "TLC Taxi Zone reference data imported from external parquet source."
        columns:
          - name: locationid
            description: "Unique TLC Taxi Zone identifier."
          - name: borough
            description: "NYC borough name."
          - name: zone
            description: "Taxi zone name within the borough."
          - name: service_zone
            description: "Service zone classification (Yellow Zone, Boro Zone, EWR)."
