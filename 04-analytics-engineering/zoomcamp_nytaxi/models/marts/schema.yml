version: 2

models:
  - name: fct_trips
    description: "Fact table containing all taxi trips (green and yellow) enriched with zone information. Materialized incrementally."
    columns:
      # identifiers
      - name: trip_id
        description: "Surrogate key generated from vendor_id, pickup_datetime, pickup_location_id and service_type."
        data_tests:
          - unique
          - not_null
      - name: vendor_id
        description: "TPEP/LPEP provider. 1=Creative Mobile Technologies, 2=VeriFone Inc."
        data_tests:
          - not_null
      - name: service_type
        description: "Taxi service type: Green or Yellow."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Green', 'Yellow']
      - name: ratecode_id
        description: "Final rate code. 1=Standard, 2=JFK, 3=Newark, 4=Nassau/Westchester, 5=Negotiated, 6=Group ride."
      - name: payment_type
        description: "Payment method code. 1=Credit card, 2=Cash, 3=No charge, 4=Dispute, 5=Unknown, 6=Voided."
      - name: trip_type
        description: "1=Street-hail, 2=Dispatch."
      # location details
      - name: pickup_location_id
        description: "TLC Taxi Zone ID where the meter was engaged."
        data_tests:
          - not_null
      - name: pickup_borough
        description: "Borough name of the pickup location."
      - name: pickup_zone
        description: "Zone name of the pickup location."
      - name: dropoff_location_id
        description: "TLC Taxi Zone ID where the meter was disengaged."
        data_tests:
          - not_null
      - name: dropoff_borough
        description: "Borough name of the dropoff location."
      - name: dropoff_zone
        description: "Zone name of the dropoff location."
      # timestamps
      - name: pickup_datetime
        description: "Date and time when the meter was engaged."
        data_tests:
          - not_null
      - name: dropoff_datetime
        description: "Date and time when the meter was disengaged."
        data_tests:
          - not_null
      - name: store_and_forward_flag
        description: "Y=store and forward trip, N=not a store and forward trip."
      # trip info
      - name: passenger_count
        description: "Number of passengers (driver-entered value)."
      - name: trip_distance
        description: "Elapsed trip distance in miles reported by the taximeter."
      - name: trip_duration_minutes
        description: "Calculated trip duration in minutes (dropoff - pickup)."
      # amounts
      - name: fare_amount
        description: "Time-and-distance fare calculated by the meter."
      - name: extra
        description: "Miscellaneous extras and surcharges ($0.50/$1 rush hour and overnight charges)."
      - name: mta_tax
        description: "$0.50 MTA tax."
      - name: tip_amount
        description: "Tip amount (credit card only, cash tips not included)."
      - name: tolls_amount
        description: "Total amount of all tolls paid in trip."
      - name: ehail_fee
        description: "E-hail fee (not currently in use, always null)."
      - name: improvement_surcharge
        description: "$0.30 improvement surcharge at flag drop."
      - name: congestion_surcharge
        description: "Congestion surcharge ($2.75 green, $2.50 yellow)."
      - name: total_amount
        description: "Total amount charged to passengers (does not include cash tips)."
      - name: payment_type_description
        description: "Human-readable payment method description, derived from payment_type_lookup seed."

  - name: dim_zones
    description: "Dimension table for TLC Taxi Zones, mapping location IDs to borough, zone and service zone."
    columns:
      - name: location_id
        description: "Unique TLC Taxi Zone identifier."
        data_tests:
          - unique
          - not_null
      - name: borough
        description: "NYC borough name (Manhattan, Brooklyn, Queens, Bronx, Staten Island, EWR)."
        data_tests:
          - not_null
      - name: zone
        description: "Taxi zone name within the borough."
        data_tests:
          - not_null
      - name: service_zone
        description: "Service zone classification (Yellow Zone, Boro Zone, EWR)."
        data_tests:
          - not_null
