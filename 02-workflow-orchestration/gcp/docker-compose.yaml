services: 
  kestra_pg:
    image: postgres:18
    volumes:
      - kestra_pg_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: k3str4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 10

  kestra:
    build:
      context: .
      dockerfile: Dockerfile
    image: kestra:gcp
    pull_policy: never
    user: "root"
    command: server standalone
    volumes:
      - kestra_data:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - kestra_tmp:/tmp/kestra-wd
      - ${APPDATA}/gcloud:/root/.config/gcloud
    environment:
      SECRET_GCP_CREDS: ${GCP_CREDENTIALS_BASE64}
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://kestra_pg:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: k3str4
        kestra:
          server:
            basicAuth:
              username: "admin@kestra.io"
              password: Admin1234!
          secret:
            type: env
            env:
              prefix: SECRET_
          repository:
            type: postgres
          storage:
            type: local
            local:
              basePath: "/app/storage"
          queue:
            type: postgres
          tasks:
            tmpDir:
              path: /tmp/kestra-wd/tmp
          url: http://localhost:8080/
    ports:
      - "8080:8080"
      - "8081:8081"

volumes:
  kestra_pg_data:
    driver: local
  kestra_data:
    driver: local
  kestra_tmp:
    driver: local
