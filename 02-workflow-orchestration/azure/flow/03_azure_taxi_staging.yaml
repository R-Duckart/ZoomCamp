  - id: purge_files
    type: io.kestra.plugin.core.storage.PurgeCurrentExecutionFiles
    description: This will remove output files. Disable it if you want to inspect Kestra outputs.
    disabled: true

pluginDefaults:
  - type: io.kestra.plugin.jdbc.sqlserver
    values:
      url: jdbc:sqlserver://{{kv('AZURE_SQL_SERVER')}}.database.windows.net:1433;database={{kv('AZURE_DB_DATABASE')}};user={{secret('AZURE_DB_USERNAME')}};password={{secret('AZURE_SQL_PASSWORD')}};encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;
