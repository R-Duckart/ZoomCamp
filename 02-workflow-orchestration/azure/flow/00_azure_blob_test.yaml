id: 00_azure_blob_test
namespace: zoomcamp
description: |
  Download NYC taxi CSV → upload to Azure Blob Storage → load into Azure SQL.

  Flow:
    extract → upload_to_blob → create_staging_table → truncate_staging
    → create_master_key → setup_credential → setup_external_datasource
    → bulk_insert_staging → create_table → insert_final → purge_files

  create_master_key
      ↓
  "Je veux stocker des secrets chiffrés dans cette DB"
      ↓
  setup_credential
      ↓
  "Voici le SAS token chiffré avec la Master Key"
      ↓
  setup_external_datasource
      ↓
  "Voici l'URL du Blob + quelle credential utiliser pour s'y connecter"
      ↓
  BULK INSERT
      ↓
  "Lis le fichier depuis ce Blob en utilisant l'External Data Source"

variables:
  file: "green_tripdata_2020-04.csv"
  blob_name: "taxi/green/2020/04/{{vars.file}}"

tasks:
  - id: set_label
    type: io.kestra.plugin.core.execution.Labels
    labels:
      file: "{{render(vars.file)}}"
      taxi: green
      target: azure-blob-sql

  - id: extract
    type: io.kestra.plugin.scripts.shell.Commands
    outputFiles:
      - "*.csv"
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    commands:
      - curl -sSL https://github.com/DataTalksClub/nyc-tlc-data/releases/download/green/{{render(vars.file)}}.gz | gunzip > {{render(vars.file)}}

  - id: upload_to_blob
    type: io.kestra.plugin.azure.storage.blob.Upload
    from: "{{outputs.extract.outputFiles[render(vars.file)]}}"
    name: "{{render(vars.blob_name)}}"

  # ── Azure SQL access setup (idempotent) ──────────────────────────────────
  - id: create_master_key
    type: io.kestra.plugin.jdbc.sqlserver.Query
    sql: |
      IF NOT EXISTS (SELECT 1 FROM sys.symmetric_keys WHERE name = '##MS_DatabaseMasterKey##')
          CREATE MASTER KEY ENCRYPTION BY PASSWORD = '{{secret('AZURE_SQL_MASTER_KEY_PASSWORD')}}'

  - id: setup_credential
    type: io.kestra.plugin.jdbc.sqlserver.Queries
    sql: |
      IF NOT EXISTS (SELECT 1 FROM sys.database_scoped_credentials WHERE name = '{{kv('AZURE_SQL_BLOB_CREDENTIAL')}}')
          CREATE DATABASE SCOPED CREDENTIAL [{{kv('AZURE_SQL_BLOB_CREDENTIAL')}}]
          WITH IDENTITY = 'SHARED ACCESS SIGNATURE',
          SECRET = '{{secret('AZURE_STORAGE_SAS_TOKEN')}}';

  - id: setup_external_datasource
    type: io.kestra.plugin.jdbc.sqlserver.Queries
    sql: |
      IF EXISTS (SELECT 1 FROM sys.external_data_sources WHERE name = '{{kv('AZURE_SQL_EXTERNAL_DATA_SOURCE')}}')
          DROP EXTERNAL DATA SOURCE [{{kv('AZURE_SQL_EXTERNAL_DATA_SOURCE')}}];
      CREATE EXTERNAL DATA SOURCE [{{kv('AZURE_SQL_EXTERNAL_DATA_SOURCE')}}]
          WITH (
              TYPE       = BLOB_STORAGE,
              LOCATION   = 'https://{{kv('AZURE_STORAGE_ACCOUNT')}}.blob.core.windows.net/{{kv('AZURE_STORAGE_CONTAINER')}}',
              CREDENTIAL = [{{kv('AZURE_SQL_BLOB_CREDENTIAL')}}]
          );

  # ── Staging table (drop + recreate to ensure correct schema) ───────────────
  - id: create_staging_table
    type: io.kestra.plugin.jdbc.sqlserver.Queries
    sql: |
      IF OBJECT_ID('[{{kv('AZURE_SQL_SCHEMA')}}].[green_tripdata_staging]', 'U') IS NOT NULL
          DROP TABLE [{{kv('AZURE_SQL_SCHEMA')}}].[green_tripdata_staging];
      CREATE TABLE [{{kv('AZURE_SQL_SCHEMA')}}].[green_tripdata_staging] (
          VendorID              NVARCHAR(50),
          lpep_pickup_datetime  NVARCHAR(50),
          lpep_dropoff_datetime NVARCHAR(50),
          store_and_fwd_flag    NVARCHAR(10),
          RatecodeID            NVARCHAR(50),
          PULocationID          NVARCHAR(50),
          DOLocationID          NVARCHAR(50),
          passenger_count       NVARCHAR(50),
          trip_distance         NVARCHAR(50),
          fare_amount           NVARCHAR(50),
          extra                 NVARCHAR(50),
          mta_tax               NVARCHAR(50),
          tip_amount            NVARCHAR(50),
          tolls_amount          NVARCHAR(50),
          ehail_fee             NVARCHAR(50),
          improvement_surcharge NVARCHAR(50),
          total_amount          NVARCHAR(50),
          payment_type          NVARCHAR(50),
          trip_type             NVARCHAR(50),
          congestion_surcharge  NVARCHAR(50)
      );

  # ── Load from Blob into staging ──────────────────────────────────────────
  - id: bulk_insert_staging
    type: io.kestra.plugin.jdbc.sqlserver.Query
    sql: |
      BULK INSERT [{{kv('AZURE_SQL_SCHEMA')}}].[green_tripdata_staging]
      FROM '{{render(vars.blob_name)}}'
      WITH (
          DATA_SOURCE     = '{{kv('AZURE_SQL_EXTERNAL_DATA_SOURCE')}}',
          FIRSTROW        = 2,
          FIELDTERMINATOR = ',',
          ROWTERMINATOR   = '0x0a',
          CODEPAGE        = '65001',
          TABLOCK
      );

  # ── Final table with proper types ────────────────────────────────────────
  - id: create_table
    type: io.kestra.plugin.jdbc.sqlserver.Query
    sql: |
      IF OBJECT_ID('[{{kv('AZURE_SQL_SCHEMA')}}].[green_tripdata]', 'U') IS NULL
      CREATE TABLE [{{kv('AZURE_SQL_SCHEMA')}}].[green_tripdata] (
          unique_row_id         NVARCHAR(32),
          filename              NVARCHAR(255),
          VendorID              NVARCHAR(50),
          lpep_pickup_datetime  DATETIME2,
          lpep_dropoff_datetime DATETIME2,
          store_and_fwd_flag    NVARCHAR(10),
          RatecodeID            NVARCHAR(50),
          PULocationID          NVARCHAR(50),
          DOLocationID          NVARCHAR(50),
          passenger_count       INT,
          trip_distance         FLOAT,
          fare_amount           DECIMAL(18,2),
          extra                 DECIMAL(18,2),
          mta_tax               DECIMAL(18,2),
          tip_amount            DECIMAL(18,2),
          tolls_amount          DECIMAL(18,2),
          ehail_fee             DECIMAL(18,2),
          improvement_surcharge DECIMAL(18,2),
          total_amount          DECIMAL(18,2),
          payment_type          INT,
          trip_type             INT,
          congestion_surcharge  DECIMAL(18,2)
      );

  - id: insert_final
    type: io.kestra.plugin.jdbc.sqlserver.Query
    sql: |
      INSERT INTO [{{kv('AZURE_SQL_SCHEMA')}}].[green_tripdata]
      SELECT
          CONVERT(NVARCHAR(32), HASHBYTES('MD5',
              COALESCE(VendorID,'')              + '|' +
              COALESCE(lpep_pickup_datetime,'')  + '|' +
              COALESCE(lpep_dropoff_datetime,'') + '|' +
              COALESCE(PULocationID,'')          + '|' +
              COALESCE(DOLocationID,'')
          ), 2)                                                       AS unique_row_id,
          '{{render(vars.file)}}'                                     AS filename,
          VendorID,
          TRY_CAST(lpep_pickup_datetime          AS DATETIME2),
          TRY_CAST(lpep_dropoff_datetime         AS DATETIME2),
          store_and_fwd_flag,
          RatecodeID,
          PULocationID,
          DOLocationID,
          TRY_CAST(NULLIF(passenger_count,'')       AS INT),
          TRY_CAST(NULLIF(trip_distance,'')         AS FLOAT),
          TRY_CAST(NULLIF(fare_amount,'')           AS DECIMAL(18,2)),
          TRY_CAST(NULLIF(extra,'')                 AS DECIMAL(18,2)),
          TRY_CAST(NULLIF(mta_tax,'')               AS DECIMAL(18,2)),
          TRY_CAST(NULLIF(tip_amount,'')            AS DECIMAL(18,2)),
          TRY_CAST(NULLIF(tolls_amount,'')          AS DECIMAL(18,2)),
          TRY_CAST(NULLIF(ehail_fee,'')             AS DECIMAL(18,2)),
          TRY_CAST(NULLIF(improvement_surcharge,'') AS DECIMAL(18,2)),
          TRY_CAST(NULLIF(total_amount,'')          AS DECIMAL(18,2)),
          TRY_CAST(NULLIF(payment_type,'')          AS INT),
          TRY_CAST(NULLIF(trip_type,'')             AS INT),
          TRY_CAST(NULLIF(congestion_surcharge,'')  AS DECIMAL(18,2))
      FROM [{{kv('AZURE_SQL_SCHEMA')}}].[green_tripdata_staging];

  - id: purge_files
    type: io.kestra.plugin.core.storage.PurgeCurrentExecutionFiles

pluginDefaults:
  - type: io.kestra.plugin.azure.storage.blob
    values:
      endpoint: "{{kv('AZURE_BLOB_ENDPOINT')}}"
      sasToken: "{{secret('AZURE_STORAGE_SAS_TOKEN')}}"
      container: "{{kv('AZURE_STORAGE_CONTAINER')}}"

  - type: io.kestra.plugin.jdbc.sqlserver
    values:
      url: "jdbc:sqlserver://{{kv('AZURE_SQL_SERVER')}}.database.windows.net:1433;database={{kv('AZURE_SQL_DATABASE')}};user={{secret('AZURE_SQL_USERNAME')}};password={{secret('AZURE_SQL_PASSWORD')}};encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;"
