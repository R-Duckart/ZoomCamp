id: 06_azure_serverless
namespace: zoomcamp
description: |
  Big data batch ingestion pattern for legacy CSV sources.
  Download CSV, convert to Parquet locally, and store in Azure Data Lake style paths.
  Designed for high-volume batch storage in a lake-first architecture.

  It convert to Parquet locally to optimize for cost and performance when ingesting into the lake, 
  store it to a Blob storage, and then create a Table into serverless SQL pool for BI tools.

inputs:
  - id: taxi
    type: SELECT
    displayName: Select taxi type
    values: [yellow, green]
    defaults: green

  - id: year
    type: SELECT
    displayName: Select year
    values: ["2019", "2020"]
    defaults: "2019"
    allowCustomValue: true

  - id: month
    type: SELECT
    displayName: Select month
    values: ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12"]
    defaults: "01"

variables:
  csv_file: "{{inputs.taxi}}_tripdata_{{inputs.year}}-{{inputs.month}}.csv"
  parquet_file: "{{inputs.taxi}}_tripdata_{{inputs.year}}-{{inputs.month}}.parquet"
  lake_path: "taxi/{{inputs.taxi}}/{{inputs.year}}/{{inputs.month}}/{{vars.parquet_file}}"
  synapse_table: "{{inputs.taxi}}_tripdata_{{inputs.year}}_{{inputs.month}}"
  synapse_external_location: "taxi/{{inputs.taxi}}/{{inputs.year}}/{{inputs.month}}/{{execution.id}}"

tasks:
  - id: set_label
    type: io.kestra.plugin.core.execution.Labels
    labels:
      taxi: "{{inputs.taxi}}"
      year: "{{inputs.year}}"
      month: "{{inputs.month}}"
      target: azure-bigdata
      format: parquet

  - id: extract_csv
    type: io.kestra.plugin.scripts.shell.Commands
    outputFiles:
      - "*.csv"
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    commands:
      - curl -sSL https://github.com/DataTalksClub/nyc-tlc-data/releases/download/{{inputs.taxi}}/{{render(vars.csv_file)}}.gz | gunzip > {{render(vars.csv_file)}}

  - id: csv_to_parquet
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    dependencies:
      - pandas
      - pyarrow
    inputFiles:
      source.csv: "{{outputs.extract_csv.outputFiles[inputs.taxi ~ '_tripdata_' ~ inputs.year ~ '-' ~ inputs.month ~ '.csv']}}"
    outputFiles:
      - "*.parquet"
      - "metrics.json"
    script: |
      import json
      import os
      import pandas as pd

      df = pd.read_csv("source.csv")

      int_columns = [
        "VendorID",
        "passenger_count",
        "RatecodeID",
        "PULocationID",
        "DOLocationID",
        "payment_type",
        "trip_type",
      ]
      float_columns = [
        "trip_distance",
        "fare_amount",
        "extra",
        "mta_tax",
        "tip_amount",
        "tolls_amount",
        "ehail_fee",
        "improvement_surcharge",
        "total_amount",
        "congestion_surcharge",
      ]

      for column in int_columns:
        if column in df.columns:
          df[column] = pd.to_numeric(df[column], errors="coerce").astype("Int64")

      for column in float_columns:
        if column in df.columns:
          df[column] = pd.to_numeric(df[column], errors="coerce")

      df["source_taxi"] = "{{inputs.taxi}}"
      df["source_year"] = "{{inputs.year}}"
      df["source_month"] = "{{inputs.month}}"

      output_path = "{{render(vars.parquet_file)}}"
      df.to_parquet(output_path, engine="pyarrow", compression="snappy", index=False)

      metrics = {
          "rows": int(len(df)),
          "columns": int(len(df.columns)),
          "parquet_file": output_path,
          "parquet_size_bytes": os.path.getsize(output_path),
      }

      with open("metrics.json", "w", encoding="utf-8") as f:
          json.dump(metrics, f)

  - id: upload_parquet_to_lake
    type: io.kestra.plugin.azure.storage.blob.Upload
    from: "{{outputs.csv_to_parquet.outputFiles[render(vars.parquet_file)]}}"
    name: "{{render(vars.lake_path)}}"

  - id: synapse_prepare_credentials_and_datasource
    type: io.kestra.plugin.jdbc.sqlserver.Queries
    sql: |
      IF NOT EXISTS (SELECT 1 FROM sys.symmetric_keys WHERE name = '##MS_DatabaseMasterKey##')
        CREATE MASTER KEY ENCRYPTION BY PASSWORD = '{{secret('AZURE_DB_MASTER_KEY_PASSWORD')}}';

      IF EXISTS (SELECT 1 FROM sys.database_scoped_credentials WHERE name = '{{kv('AZURE_BLOB_CREDENTIAL')}}')
      BEGIN
          ALTER DATABASE SCOPED CREDENTIAL [{{kv('AZURE_BLOB_CREDENTIAL')}}]
            WITH IDENTITY = 'SHARED ACCESS SIGNATURE',
            SECRET = '{{secret('AZURE_STORAGE_SAS_TOKEN')}}';
      END
      ELSE
      BEGIN
        CREATE DATABASE SCOPED CREDENTIAL [{{kv('AZURE_BLOB_CREDENTIAL')}}]
          WITH IDENTITY = 'SHARED ACCESS SIGNATURE',
          SECRET = '{{secret('AZURE_STORAGE_SAS_TOKEN')}}';
      END;
      
      IF NOT EXISTS (SELECT 1 FROM sys.external_data_sources WHERE name = '{{kv('AZURE_EXTERNAL_DATA_SOURCE')}}')
        CREATE EXTERNAL DATA SOURCE [{{kv('AZURE_EXTERNAL_DATA_SOURCE')}}]
        WITH (
          LOCATION   = 'https://{{kv('AZURE_STORAGE_ACCOUNT')}}.blob.core.windows.net/{{kv('AZURE_STORAGE_CONTAINER')}}',
          CREDENTIAL = [{{kv('AZURE_BLOB_CREDENTIAL')}}]
        );

      IF NOT EXISTS (SELECT 1 FROM sys.external_file_formats WHERE name = 'ParquetFileFormat')
        CREATE EXTERNAL FILE FORMAT [ParquetFileFormat] WITH (FORMAT_TYPE = PARQUET);

  - id: if_yellow_taxi
    type: io.kestra.plugin.core.flow.If
    condition: "{{inputs.taxi == 'yellow'}}"
    then:
      - id: upsert_yellow_from_parquet
        type: io.kestra.plugin.jdbc.sqlserver.Queries
        sql: |
          IF OBJECT_ID('[{{kv('AZURE_SYNAPSE_SCHEMA')}}].[yellow_tripdata]') IS NOT NULL
            DROP EXTERNAL TABLE [{{kv('AZURE_SYNAPSE_SCHEMA')}}].[yellow_tripdata];

          CREATE EXTERNAL TABLE [{{kv('AZURE_SYNAPSE_SCHEMA')}}].[yellow_tripdata] (
            VendorID BIGINT,
            tpep_pickup_datetime NVARCHAR(50),
            tpep_dropoff_datetime NVARCHAR(50),
            passenger_count BIGINT,
            trip_distance FLOAT,
            RatecodeID BIGINT,
            store_and_fwd_flag NVARCHAR(10),
            PULocationID BIGINT,
            DOLocationID BIGINT,
            payment_type BIGINT,
            fare_amount FLOAT,
            extra FLOAT,
            mta_tax FLOAT,
            tip_amount FLOAT,
            tolls_amount FLOAT,
            improvement_surcharge FLOAT,
            total_amount FLOAT,
            congestion_surcharge FLOAT,
            source_taxi NVARCHAR(50),
            source_year NVARCHAR(10),
            source_month NVARCHAR(10)
          )
          WITH (
            LOCATION = 'taxi/yellow/*/*/*.parquet',
            DATA_SOURCE = [{{kv('AZURE_EXTERNAL_DATA_SOURCE')}}],
            FILE_FORMAT = [ParquetFileFormat]
          );

  - id: if_green_taxi
    type: io.kestra.plugin.core.flow.If
    condition: "{{inputs.taxi == 'green'}}"
    then:
      - id: upsert_green_from_parquet
        type: io.kestra.plugin.jdbc.sqlserver.Queries
        sql: |
          IF OBJECT_ID('[{{kv('AZURE_SYNAPSE_SCHEMA')}}].[green_tripdata]') IS NOT NULL
            DROP EXTERNAL TABLE [{{kv('AZURE_SYNAPSE_SCHEMA')}}].[green_tripdata];

          CREATE EXTERNAL TABLE [{{kv('AZURE_SYNAPSE_SCHEMA')}}].[green_tripdata] (
            VendorID BIGINT,
            lpep_pickup_datetime NVARCHAR(50),
            lpep_dropoff_datetime NVARCHAR(50),
            store_and_fwd_flag NVARCHAR(10),
            RatecodeID BIGINT,
            PULocationID BIGINT,
            DOLocationID BIGINT,
            passenger_count BIGINT,
            trip_distance FLOAT,
            fare_amount FLOAT,
            extra FLOAT,
            mta_tax FLOAT,
            tip_amount FLOAT,
            tolls_amount FLOAT,
            ehail_fee FLOAT,
            improvement_surcharge FLOAT,
            total_amount FLOAT,
            payment_type BIGINT,
            trip_type BIGINT,
            congestion_surcharge FLOAT,
            source_taxi NVARCHAR(50),
            source_year NVARCHAR(10),
            source_month NVARCHAR(10)
          )
          WITH (
            LOCATION = 'taxi/green/*/*/*.parquet',
            DATA_SOURCE = [{{kv('AZURE_EXTERNAL_DATA_SOURCE')}}],
            FILE_FORMAT = [ParquetFileFormat]
          );
            
  - id: report_batch_metrics
    type: io.kestra.plugin.core.log.Log
    message: |
      Batch completed.
      lake_path={{render(vars.lake_path)}}
      synapse_table={{kv('AZURE_SYNAPSE_SCHEMA')}}.{{render(vars.synapse_table)}}

  - id: purge_files
    type: io.kestra.plugin.core.storage.PurgeCurrentExecutionFiles
    description: Disable if you want to inspect temporary artifacts.
    disabled: false

triggers:
  - id: monthly_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 5 1 * *"
    inputs:
      taxi: green
      year: "{{ now() | date('yyyy') }}"
      month: "{{ now() | date('MM') }}"
    disabled: true

pluginDefaults:
  - type: io.kestra.plugin.azure.storage.blob
    values:
      endpoint: "{{kv('AZURE_BLOB_ENDPOINT')}}"
      sasToken: "{{secret('AZURE_STORAGE_SAS_TOKEN')}}"
      container: "{{kv('AZURE_STORAGE_CONTAINER')}}"

  - type: io.kestra.plugin.jdbc.sqlserver
    values:
      url: "jdbc:sqlserver://{{kv('AZURE_SYNAPSE_SQL_ENDPOINT')}}:1433;database={{kv('AZURE_SYNAPSE_DATABASE')}};user={{secret('AZURE_SYNAPSE_DB_USERNAME')}};password={{secret('AZURE_SYNAPSE_DB_PASSWORD')}};encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.sql.azuresynapse.net;loginTimeout=30;"
