id: 02_azure_db_sql_kv
namespace: zoomcamp
description: |
  Azure configuration values used by the Azure-based Kestra flows.
  Secrets such as connection strings, SAS tokens, and passwords must stay in Kestra secrets.

tasks:
  - id: azure_sql_server
    type: io.kestra.plugin.core.kv.Set
    key: AZURE_SQL_SERVER
    kvType: STRING
    value: your-sql-server # TODO server name without .database.windows.net

  - id: azure_sql_database
    type: io.kestra.plugin.core.kv.Set
    key: AZURE_SQL_DATABASE
    kvType: STRING
    value: free-ny-taxi

  - id: azure_sql_schema
    type: io.kestra.plugin.core.kv.Set
    key: AZURE_SQL_SCHEMA
    kvType: STRING
    value: dbo
